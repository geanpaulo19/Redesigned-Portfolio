    <script>
      (function resizeFloatingBtn() {
        const el = document.querySelector("cal-floating-button");
        if (el && el.shadowRoot) {
          const btn = el.shadowRoot.querySelector("button");
          const icon = el.shadowRoot.querySelector("#button-icon svg");
          const label = el.shadowRoot.querySelector("#button");
          if (btn) {
            btn.style.height = "2.5rem";
            btn.style.padding = "0.375rem 0.875rem";
            btn.style.fontSize = "0.8125rem";
          }
          if (icon) {
            icon.style.height = "1.125rem";
            icon.style.width = "1.125rem";
          }
          if (label) {
            label.style.marginLeft = "0.375rem";
          }
        } else {
          setTimeout(resizeFloatingBtn, 100);
        }
      })();
    </script>
